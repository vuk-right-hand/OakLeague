# fly.toml app configuration file generated for oakleague-voice-proxy on 2026-04-21T14:40:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# OAKLEAGUE-SCALING-GUARD: This proxy holds per-session in-memory state
# (cogs failure counters, quota cache, sessionToWs Map). Horizontal scaling
# beyond 1 machine requires revisiting SPIKE_A_DEFERRED_FIXUP_PLAN.md §1A.2 +
# adding session-affinity routing or moving state to Redis. Before changing
# `min_machines_running` above 0, increasing `fly scale count` above 1, or
# adding additional [[vm]] blocks, leave a comment '# scaling-approved: <issue#>'
# next to the change. The CI workflow .github/workflows/scaling-guard.yml
# enforces this on PRs.
#

app = 'oakleague-voice-proxy'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Spike-era config: auto-stop when idle, auto-start on first request. Wake
  # time is ~1s on trial tier (verified 2026-04-21), acceptable for demo.
  # For production voice sessions, revisit: set min_machines_running higher +
  # consider 'suspend' instead of 'stop' to shave wake time.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
